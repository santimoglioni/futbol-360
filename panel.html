<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Panel F360</title>

    <link
        rel="stylesheet"
        href="panel.css"
    >

</head>


<body>


    <!-- =================================
         LOGIN
    ================================== -->

    <section
        id="login-section"
        class="login-container"
    >

        <div class="login-box">


            <div class="logo">

                <span>F</span>360

            </div>


            <div class="login-etiqueta">

                PANEL PRIVADO

            </div>


            <h1>

                Panel de periodista

            </h1>


            <p>

                Ingresá para administrar
                tus publicaciones.

            </p>


            <form
                id="login-form"
            >


                <!-- EMAIL -->

                <div class="campo">

                    <label
                        for="email"
                    >

                        Correo electrónico

                    </label>


                    <input
                        type="email"
                        id="email"
                        placeholder="tu@email.com"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="campo">

                    <label
                        for="password"
                    >

                        Contraseña

                    </label>


                    <input
                        type="password"
                        id="password"
                        placeholder="Tu contraseña"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="boton-principal"
                >

                    INICIAR SESIÓN

                </button>


                <p
                    id="login-message"
                    class="mensaje"
                ></p>


            </form>

        </div>

    </section>



    <!-- =================================
         PANEL
    ================================== -->

    <section
        id="panel-section"
        class="panel-container hidden"
    >


        <!-- HEADER -->

        <header class="panel-header">


            <a
                href="index.html"
                class="panel-logo"
            >

                <span>F</span>360

            </a>


            <div
                class="panel-user"
            >

                <div>

                    <small>
                        SESIÓN
                    </small>


                    <span
                        id="usuario-email"
                    ></span>

                </div>


                <button
                    id="logout-button"
                    type="button"
                >

                    CERRAR SESIÓN

                </button>

            </div>

        </header>



        <!-- CONTENIDO -->

        <main
            class="panel-main"
        >


            <!-- CABECERA -->

            <div
                class="panel-titulo"
            >


                <div>

                    <span>
                        NUEVA PUBLICACIÓN
                    </span>


                    <h1>
                        Crear una nota
                    </h1>

                </div>


                <div
                    class="panel-enlaces"
                >

                    <a
                        href="estadisticas.html"
                    >

                        📊 ESTADÍSTICAS

                    </a>


                    <a
                        href="index.html"
                    >

                        ← VOLVER A F360

                    </a>

                </div>


            </div>



            <!-- FORMULARIO -->

            <form
                id="nota-form"
                class="nota-form"
            >


                <!-- =================================
                     TÍTULO
                ================================== -->

                <div
                    class="campo"
                >

                    <label
                        for="titulo"
                    >

                        Título

                    </label>


                    <input
                        type="text"
                        id="titulo"
                        placeholder="Escribí el título de la noticia..."
                        autocomplete="off"
                        required
                    >

                </div>



                <!-- =================================
                     BAJADA
                ================================== -->

                <div
                    class="campo"
                >

                    <label
                        for="bajada"
                    >

                        Bajada

                    </label>


                    <textarea
                        id="bajada"
                        rows="3"
                        placeholder="Una breve descripción que acompañe al título..."
                    ></textarea>

                </div>



                <!-- =================================
                     CATEGORÍA
                ================================== -->

                <div
                    class="campo"
                >

                    <label
                        for="categoria"
                    >

                        Categoría

                    </label>


                    <select
                        id="categoria"
                        required
                    >

                        <option
                            value=""
                        >

                            Seleccionar categoría

                        </option>


                        <option
                            value="Fútbol Argentino"
                        >

                            Fútbol Argentino

                        </option>


                        <option
                            value="Selección"
                        >

                            Selección

                        </option>


                        <option
                            value="Mercado de Pases"
                        >

                            Mercado de Pases

                        </option>

                    </select>

                </div>



                <!-- =================================
                     IMAGEN
                ================================== -->

                <div
                    class="campo"
                >

                    <label
                        for="imagen"
                    >

                        Imagen principal

                    </label>


                    <input
                        type="file"
                        id="imagen"
                        accept="image/jpeg,image/png,image/webp"
                    >


                    <p
                        class="ayuda-imagen"
                    >

                        JPG, PNG o WEBP.
                        Máximo 5 MB.

                    </p>


                    <div
                        id="preview-container"
                        class="preview-container hidden"
                    >

                        <img
                            id="preview-imagen"
                            src=""
                            alt="Vista previa de la imagen"
                        >

                    </div>

                </div>



                <!-- =================================
                     CONTENIDO
                ================================== -->

                <div
                    class="campo"
                >

                    <label
                        for="contenido"
                    >

                        Contenido de la nota

                    </label>


                    <textarea
                        id="contenido"
                        class="contenido"
                        placeholder="Escribí tu nota periodística...

Separá los párrafos con Enter."
                        required
                    ></textarea>


                    <p
                        class="ayuda-contenido"
                    >

                        Cada Enter genera un nuevo
                        párrafo en la noticia.

                    </p>

                </div>



                <!-- =================================
                     ACCIONES
                ================================== -->

                <div
                    class="acciones"
                >

                    <button
                        type="submit"
                        id="publicar-button"
                        class="boton-publicar"
                    >

                        PUBLICAR NOTA

                    </button>


                    <span
                        id="nota-message"
                        class="mensaje"
                    ></span>

                </div>


            </form>

        </main>

    </section>



    <!-- =================================
         SUPABASE
    ================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <!-- =================================
         JAVASCRIPT
    ================================== -->

    <script
        src="panel.js"
    ></script>


</body>

</html>
